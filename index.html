<style>
:root{
  --brand:#5B1A7A; --brand-deep:#2A0638; --brand-soft:#F3E8F8; --gold:#E8A317; --gold-2:#FFC94A;
  --bg:#F7F2F8; --surface:#FFFFFF; --fg:#221028; --muted:#7C6D84; --line:#ECE3EF; --ok:#1E8A4C; --warn:#B4560E; --wa:#1FA855;
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --fd:"Fraunces",Georgia,serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  /* layout: vitrine de app de delivery — capa, lista de produtos, ficha do produto em folha e sacola fixa */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{font-family:var(--f);color:var(--fg);font-size:15px;line-height:1.45;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.m{font-variant-numeric:tabular-nums}
.wrap{max-width:620px;margin:0 auto}

/* capa */
.cover{height:150px;background:radial-gradient(120% 120% at 20% 0%,#8A33B3 0%,var(--brand) 45%,var(--brand-deep) 100%);position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px)}
.store{background:var(--surface);border-radius:26px 26px 0 0;margin-top:-28px;position:relative;padding:0 18px 16px;text-align:center;box-shadow:0 -6px 20px rgba(42,6,56,.08)}
.store img{width:92px;height:92px;border-radius:50%;margin-top:-46px;box-shadow:0 0 0 4px var(--surface),0 0 0 6px var(--gold),0 10px 24px rgba(42,6,56,.3);background:#2A0638}
.store h1{font-family:var(--fd);font-weight:600;font-size:26px;letter-spacing:-.015em;margin:8px 0 2px;font-variation-settings:"SOFT" 50,"opsz" 72}
.store h1 em{font-style:italic;color:var(--brand)}
.meta{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 10px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ok);font-weight:700}
.meta b.off{color:var(--warn)}
.meta i{font-style:normal;opacity:.5}
.hrs{margin-top:2px}
.hrs summary{list-style:none;cursor:pointer;align-items:center}
.hrs summary::-webkit-details-marker{display:none}
.hrs .chev{font-size:13px;transition:transform .2s var(--ease)}
.hrs[open] .chev{transform:rotate(180deg)}
.hrs ul{list-style:none;margin:10px auto 0;padding:10px 14px;max-width:280px;background:var(--bg);border-radius:14px;font-size:13.5px;text-align:left}
.hrs li{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.hrs li.hj{color:var(--fg);font-weight:800}
.promo{margin:14px 16px 0;background:linear-gradient(135deg,#FFE7A3,#FFC94A);color:var(--brand-deep);border-radius:16px;padding:12px 14px;font-size:13.5px}
.promo b{display:block;font-size:15px}

/* abas */
.tabs{position:sticky;top:0;z-index:5;background:rgba(247,242,248,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
.tab{border:0;background:transparent;font-weight:800;font-size:14px;padding:6px 10px;border-radius:999px;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--brand);color:#fff}
.sec{padding:6px 16px 0}
.sec h2{font-family:var(--fd);font-weight:600;font-size:22px;letter-spacing:-.01em;margin:18px 0 4px}
.sec p.sub{margin:0 0 10px;color:var(--muted);font-size:13.5px}

/* produtos */
.prod{width:100%;text-align:left;display:flex;gap:14px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.prod:hover{box-shadow:0 8px 22px rgba(42,6,56,.08)}
.prod:active{transform:scale(.99)}
.prod .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.prod h3{margin:0;font-size:17px;font-weight:800}
.prod .ds{margin:4px 0 8px;color:var(--muted);font-size:13.5px}
.prod .pr{margin-top:auto;font-weight:800;font-size:17px}
.prod .tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:2px 8px;vertical-align:2px}
.prod .ph{width:112px;height:112px;border-radius:16px;object-fit:cover;flex:none;background:var(--brand-soft)}
.info{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:12px 14px;font-size:13.5px;color:var(--muted);margin-bottom:12px}
.info b{color:var(--fg)}
.badge10{flex:none;width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--gold-2);display:grid;place-items:center;font-weight:800;font-size:12px}

/* barra da sacola */
.bag{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bag button{pointer-events:auto;max-width:592px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;border:0;border-radius:18px;background:var(--brand);color:#fff;padding:14px 16px;font-weight:800;box-shadow:0 12px 28px rgba(42,6,56,.35);transform:translateY(140%);transition:transform .25s var(--ease)}
.bag.on button{transform:none}
.bag .n{background:var(--gold-2);color:var(--brand-deep);min-width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font-size:13px;padding:0 6px}
.bag .l{flex:1;text-align:left}

/* folhas */
.ov{position:fixed;inset:0;z-index:40;background:rgba(34,16,40,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.ov.on{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:94vh;max-height:94dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;transform:translateY(30px);transition:transform .25s var(--ease)}
.ov.on .sheet{transform:none}
.sh-body{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.sh-hero{position:relative;background:var(--surface)}
.sh-hero img{width:100%;height:240px;object-fit:cover;object-position:50% 6%;display:block}
.x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.18);font-size:20px;line-height:1}
.sh-head{background:var(--surface);padding:14px 18px 16px;border-bottom:1px solid var(--line)}
.sh-head h3{margin:0;font-family:var(--fd);font-weight:600;font-size:24px;letter-spacing:-.01em}
.sh-head .pr{font-weight:800;font-size:17px;margin-top:4px}
.sh-head p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.grp{margin-top:10px;background:var(--surface)}
.grp-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;background:#EFE6F2;position:sticky;top:0;z-index:2}
.grp-h b{display:block;font-size:14.5px;text-transform:uppercase;letter-spacing:.02em}
.grp-h small{color:var(--muted);font-size:12.5px}
.pill{font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 9px;white-space:nowrap}
.pill.req{background:var(--brand-deep);color:#fff}
.pill.ok{background:#DDF3E6;color:var(--ok)}
.pill.cnt{background:var(--surface);color:var(--brand)}
.opt{width:100%;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 18px;text-align:left}
.opt:last-child{border-bottom:0}
.opt .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;overflow:hidden;font-family:var(--fd);font-weight:600;font-size:19px;letter-spacing:-.02em;color:var(--brand-deep);box-shadow:inset 0 0 0 1px rgba(42,6,56,.06)}
.opt .ic img{width:100%;height:100%;object-fit:cover;display:block}
.opt .nm{flex:1;min-width:0;font-weight:700}
.opt .nm small{display:block;font-weight:600;color:var(--muted);font-size:12.5px}
.opt .nm .p{color:var(--brand);font-weight:800}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid #CDBFD3;display:grid;place-items:center;flex:none;transition:all .15s var(--ease)}
.opt[aria-pressed="true"] .ck{background:var(--brand);border-color:var(--brand)}
.opt[aria-pressed="true"] .ck::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.obs{padding:14px 18px 18px}
.obs label{display:block;font-weight:800;font-size:14px;margin-bottom:8px}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff;outline:none;resize:none}
textarea:focus,input:focus{border-color:var(--brand)}
.sh-foot{display:flex;gap:10px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;flex:none}
.qty button{border:0;background:transparent;width:40px;height:46px;font-size:20px;color:var(--brand);font-weight:800}
.qty button:disabled{opacity:.3}
.qty span{min-width:26px;text-align:center;font-weight:800}
.go{flex:1;border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;padding:14px;display:flex;justify-content:space-between;gap:10px;font-size:15px}
.go:disabled{background:#C9BCCF}
.go span{white-space:nowrap}
.go.wa{background:var(--wa)}
.go.wa:disabled{background:#B9C7BE}

/* sacola */
.bag-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.bag-h h3{margin:0;font-family:var(--fd);font-weight:600;font-size:22px}
.bag-h .x{position:static;box-shadow:none;background:var(--bg)}
.line{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.line img{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none}
.line .tx{flex:1;min-width:0}
.line b{display:block}
.line span{display:block;color:var(--muted);font-size:13px}
.line .pv{font-weight:800;white-space:nowrap}
.line .rm{border:0;background:none;color:var(--warn);font-weight:700;font-size:12.5px;padding:4px 0 0}
.addmore{width:100%;border:0;background:var(--surface);color:var(--brand);font-weight:800;padding:14px;border-bottom:1px solid var(--line)}
.tot{background:var(--surface);padding:12px 18px;margin-top:10px}
.tot div{display:flex;justify-content:space-between;font-size:14px;margin:3px 0}
.tot .big{font-size:18px;font-weight:800;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.tot .d{color:var(--ok);font-weight:700}
.form{background:var(--surface);padding:14px 18px;margin-top:10px}
.fld{margin-bottom:12px}
.fld:last-child{margin-bottom:0}
.fld label{display:block;font-weight:800;font-size:13.5px;margin-bottom:6px}
.fld label small{font-weight:600;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.hint{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.pick{display:flex;gap:10px;align-items:center;background:var(--brand-soft);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--brand-deep)}
.pick svg{width:22px;height:22px;flex:none}

/* envio (computador) */
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
pre.pv{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:12.5px/1.45 var(--f);white-space:pre-wrap;max-height:28vh;overflow:auto}
.send-b{padding:18px;display:grid;gap:10px;background:var(--surface)}
.send-b h3{margin:0;font-family:var(--fd);font-weight:600;font-size:22px}
.btn2{border:0;border-radius:14px;padding:14px;font-weight:800;text-align:center;text-decoration:none;display:block}
.btn2.wa{background:var(--wa);color:#fff}
.btn2.alt{background:var(--brand-soft);color:var(--brand)}
.btn2.gh{background:transparent;color:var(--muted)}

.pixb{border:1.5px solid var(--brand);background:var(--brand-soft);border-radius:16px;padding:14px}
.pix-t{font-size:16px;margin-bottom:10px}
.pix-k{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:10px 12px}
.pix-k span{flex:1;min-width:0}
.pix-k small{display:block;color:var(--muted);font-size:12px}
.pix-k b{display:block;font-size:15px;overflow-wrap:anywhere}
.pix-cp{border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:800;padding:10px 12px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--brand-deep);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;font-size:13.5px;z-index:60;opacity:0;transition:all .25s var(--ease);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 16px 8px}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:24px;max-height:90vh}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const ini=n=>n.replace(/^(Calda|Creme) de /,"").split(/\s+/).filter(w=>w.length>2||/^[A-Z]/.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join("");
const tile=(n,bg)=>FOTOS[n]?`<span class="ic"><img src="data:image/jpeg;base64,${FOTOS[n]}" alt=""></span>`:`<span class="ic" style="background:${bg}">${ini(n)}</span>`;
const nomesFrutas=CFG.frutas.map(f=>f[0]);
const contaLim=x=>!nomesFrutas.includes(x)||CFG.frutasContamNoLimite;
const st={cart:[],cur:null,pag:"Pix",num:""};
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)}
function openOv(id){$(id).classList.add("on");document.body.classList.add("lock")}
function closeOv(id){$(id).classList.remove("on");if(!document.querySelector(".ov.on"))document.body.classList.remove("lock")}
const itemPreco=i=>prodDe(i.tam).preco+i.adds.reduce((s,id)=>s+addDe(id).preco,0);

const DIAS=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const hh=h=>h>=24?"00h":h+"h";
function status(){
  if(CFG.forcarAberto)return{ab:true,txt:""};
  const d=new Date(),dia=d.getDay(),h=d.getHours()+d.getMinutes()/60,H=CFG.horarios,t=H[dia];
  if(t&&h>=t[0]&&h<t[1])return{ab:true,txt:"até "+hh(t[1])};
  if(t&&h<t[0])return{ab:false,txt:"abre hoje às "+hh(t[0])};
  for(let k=1;k<=7;k++){const x=(dia+k)%7;if(H[x])return{ab:false,txt:"abre "+(k===1?"amanhã":DIAS[x])+" às "+hh(H[x][0])}}
  return{ab:false,txt:""};
}
function drawStatus(){
  const r=status();CFG.aberto=r.ab;const s=$("st");s.textContent=r.ab?"Aberto agora":"Fechado agora";s.classList.toggle("off",!r.ab);$("st2").textContent=r.txt?"· "+r.txt:"";
  const hoje=new Date().getDay();$("hrs-l").innerHTML=[1,2,3,4,5,6,0].map(i=>{const t=CFG.horarios[i];return`<li class="${i===hoje?"hj":""}"><span>${DIAS[i][0].toUpperCase()+DIAS[i].slice(1)}</span><span class="m">${t?hh(t[0])+" às "+hh(t[1]):"Fechado"}</span></li>`}).join("");
}
function drawTop(){
  drawStatus();
  const p=CFG.promo;$("promo").innerHTML=p&&p.ativo?`<div class="promo"><b>${esc(p.titulo)}</b>${esc(p.texto)} · aplicado automaticamente na sacola</div>`:"";
  $("prods").innerHTML=CFG.produtos.map(p=>`<button class="prod" data-p="${p.id}"><span class="tx"><h3>${esc(p.nome)}${p.tag?`<span class="tag">${esc(p.tag)}</span>`:""}</h3><span class="ds">${esc(p.desc)}</span><span class="pr m">${fmt(p.preco)}</span></span><img class="ph" src="data:image/jpeg;base64,${p.foto}" alt="${esc(p.nome)}"></button>`).join("");
}

/* ---------- ficha do produto ---------- */
function openProd(id,editIdx){
  const p=prodDe(id);const base=editIdx!=null?st.cart[editIdx]:null;
  st.cur={tam:id,sel:base?[...base.sel]:[],adds:base?[...base.adds]:[],obs:base?base.obs:"",qty:1,edit:editIdx};
  drawProd(true);openOv("ov-prod");
}
function drawProd(first){
  const c=st.cur,p=prodDe(c.tam),used=c.sel.filter(contaLim).length,full=used>=p.limite;
  const body=first?null:$("pd").querySelector(".sh-body"),scroll=body?body.scrollTop:0;
  const optG=([n,ic,bg])=>{const on=c.sel.includes(n);return`<button class="opt" data-g="${esc(n)}" aria-pressed="${on}" ${!on&&full&&contaLim(n)?"disabled":""}>${tile(n,bg)}<span class="nm">${esc(n)}</span><span class="ck"></span></button>`};
  const reqPill=c.sel.length?`<span class="pill ok">${used}/${p.limite}</span>`:`<span class="pill req">Obrigatório</span>`;
  const unit=itemPreco(c);
  $("pd").innerHTML=`<div class="sh-body">
   <div class="sh-hero"><img src="data:image/jpeg;base64,${p.foto}" alt=""><button class="x" data-x="ov-prod" aria-label="Fechar">×</button></div>
   <div class="sh-head"><h3 id="pd-name">${esc(p.nome)}</h3><div class="pr m">${fmt(p.preco)}</div><p>${esc(p.desc)}</p></div>
   <div class="grp"><div class="grp-h"><span><b>Complementos grátis</b><small>Escolha de 1 até ${p.limite}${CFG.frutasContamNoLimite?" (frutas contam)":""}</small></span>${reqPill}</div>${CFG.gratis.map(optG).join("")}</div>
   <div class="grp"><div class="grp-h"><span><b>Frutas</b><small>${CFG.frutasContamNoLimite?"Contam no limite de complementos":"Grátis, fora do limite"}</small></span><span class="pill cnt">Grátis</span></div>${CFG.frutas.map(optG).join("")}</div>
   <div class="grp"><div class="grp-h"><span><b>Adicionais pagos</b><small>Turbine o seu açaí</small></span><span class="pill cnt">Opcional</span></div>
    ${CFG.pagos.map(a=>{const on=c.adds.includes(a.id);return`<button class="opt" data-a="${a.id}" aria-pressed="${on}">${tile(a.nome,a.bg)}<span class="nm">${esc(a.nome)}<small><span class="p">+ ${fmt(a.preco)}</span></small></span><span class="ck"></span></button>`}).join("")}</div>
   <div class="grp obs"><label for="f-obs-i">Alguma observação?</label><textarea id="f-obs-i" rows="2" maxlength="140" placeholder="Ex.: pouco leite condensado">${esc(c.obs)}</textarea></div>
  </div>
  <div class="sh-foot">${c.edit==null?`<div class="qty"><button data-q="-1" aria-label="Diminuir" ${c.qty<=1?"disabled":""}>−</button><span class="m">${c.qty}</span><button data-q="1" aria-label="Aumentar">+</button></div>`:""}
   <button class="go" id="add" ${c.sel.length?"":"disabled"}><span>${c.sel.length?(c.edit!=null?"Salvar":"Adicionar"):"Escolha 1 item"}</span><span class="m">${fmt(unit*c.qty)}</span></button></div>`;
  if(!first){const b=$("pd").querySelector(".sh-body");b.scrollTop=scroll}
}
function saveObs(){const t=$("f-obs-i");if(t&&st.cur)st.cur.obs=t.value.trim()}

/* ---------- sacola ---------- */
function calc(){
  let sub=st.cart.reduce((s,i)=>s+itemPreco(i),0),desc=0;const p=CFG.promo;
  if(p&&p.ativo){const el=st.cart.filter(i=>i.tam===p.tam),k=Math.floor(el.length/p.qtd);
    if(k){desc+=k*(p.qtd*prodDe(p.tam).preco-p.precoCombo);el.slice(0,k*p.qtd).forEach(i=>i.adds.forEach(id=>{if(p.gratis.includes(id))desc+=addDe(id).preco}))}}
  return{sub,desc,total:sub-desc};
}
function drawBagBar(){const n=st.cart.length;$("bag").classList.toggle("on",n>0);$("bag-n").textContent=n;$("bag-t").textContent=fmt(calc().total)}
function drawBag(){
  const c=calc();
  $("bg").innerHTML=`<div class="bag-h"><h3 id="bg-title">Sua sacola</h3><button class="x" data-x="ov-bag" aria-label="Fechar">×</button></div>
  <div class="sh-body">
   ${st.cart.map((i,k)=>{const p=prodDe(i.tam),ad=i.adds.map(addDe);return`<div class="line"><img src="data:image/jpeg;base64,${p.foto}" alt=""><div class="tx"><b>${esc(p.nome)}</b><span>${esc(i.sel.join(", "))}</span>${ad.length?`<span>+ ${esc(ad.map(a=>a.nome).join(", "))}</span>`:""}${i.obs?`<span>Obs.: ${esc(i.obs)}</span>`:""}<button class="rm" data-ed="${k}" style="color:var(--brand)">Editar</button> · <button class="rm" data-rm="${k}">Remover</button></div><span class="pv m">${fmt(itemPreco(i))}</span></div>`}).join("")}
   <button class="addmore" data-x="ov-bag">+ Adicionar mais açaí</button>
   <div class="tot"><div><span>Subtotal</span><span class="m">${fmt(c.sub)}</span></div>${c.desc?`<div><span class="d">Promoção</span><span class="d m">− ${fmt(c.desc)}</span></div>`:""}<div class="big"><span>Total</span><span class="m">${fmt(c.total)}</span></div></div>
   <div class="form">
    <div class="fld"><div class="pick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span><b>Somente retirada.</b> A gente avisa pelo WhatsApp quando o seu açaí estiver pronto.</span></div></div>
    <div class="fld"><label for="f-nome">Seu nome</label><input id="f-nome" type="text" autocomplete="given-name" placeholder="Como podemos te chamar?"></div>
    <div class="fld"><label for="f-apto">Bloco / apartamento <small>(opcional)</small></label><input id="f-apto" type="text" placeholder="Ex.: Bloco 7 · 504"></div>
    <div class="fld"><label>Pagamento</label><div class="seg" role="group" aria-label="Pagamento">${["Pix","Cartão","Dinheiro"].map(x=>`<button data-pg="${x}" aria-pressed="${st.pag===x}">${x}</button>`).join("")}</div><p class="hint">${st.pag==="Pix"?"A gente te manda a chave Pix ao confirmar o pedido.":st.pag==="Cartão"?"Crédito ou débito na maquininha, na retirada.":"Se precisar de troco, avise na observação."}</p></div>
    <div class="fld"><label for="f-obs">Observação do pedido <small>(opcional)</small></label><textarea id="f-obs" rows="2" placeholder="Ex.: retiro às 20h"></textarea></div>
   </div>
  </div>
  <div class="sh-foot"><button class="go wa" id="send" ${CFG.aberto?"":"disabled"}><span>${CFG.aberto?"Enviar pedido pelo WhatsApp":"Fechado no momento"}</span><span class="m">${fmt(c.total)}</span></button></div>`;
  try{const s=JSON.parse(localStorage.getItem("lalas-cli")||"null");if(s){$("f-nome").value=s.n||"";$("f-apto").value=s.a||""}}catch(_){}
  if(st.form){$("f-nome").value=st.form.n;$("f-apto").value=st.form.a;$("f-obs").value=st.form.o}
}
function keepForm(){if($("f-nome"))st.form={n:$("f-nome").value,a:$("f-apto").value,o:$("f-obs").value}}

/* ---------- mensagem e envio ---------- */
function novoNum(){const d=new Date(),ini=($("f-nome").value||"").normalize("NFD").replace(/[^A-Za-z]/g,"").slice(0,2).toUpperCase()||"LA";return String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"-"+ini}
function msg(){
  const c=calc(),nome=$("f-nome").value.trim(),apto=$("f-apto").value.trim(),obs=$("f-obs").value.trim();
  const L=[`🍇 *Pedido nº ${st.num} · Lala's Açaí*`,"",`*Cliente:* ${nome}${apto?" · "+apto:""}`,"*Recebimento:* Retirada",""];
  st.cart.forEach((i,k)=>{const ad=i.adds.map(addDe);L.push(`*${k+1}) Açaí ${i.tam} ml* · ${fmt(itemPreco(i))}`);L.push(`   Complementos: ${i.sel.join(", ")}`);if(ad.length)L.push(`   Adicionais: ${ad.map(a=>`${a.nome} (+${fmt(a.preco)})`).join(", ")}`);if(i.obs)L.push(`   Obs.: ${i.obs}`)});
  L.push("");if(c.desc)L.push(`Promoção: − ${fmt(c.desc)}`);L.push(`*Total: ${fmt(c.total)}*`,`*Pagamento:* ${st.pag}`);if(obs)L.push(`*Observação:* ${obs}`);
  return L.join("\n");
}
function copiar(m){let ok=false;try{const ta=document.createElement("textarea");ta.value=m;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,m.length);ok=document.execCommand("copy");ta.remove()}catch(_){}try{navigator.clipboard&&navigator.clipboard.writeText(m).catch(()=>{})}catch(_){}return ok}
function pixBox(total){const p=CFG.pix;return`<div class="pixb"><div class="pix-t">Pague <b class="m">${fmt(total)}</b> no Pix</div><div class="pix-k"><span><small>Chave Pix · ${esc(p.tipo)}</small><b>${esc(p.chave)}</b>${p.nome?`<small>${esc(p.nome)}</small>`:""}</span><button class="pix-cp" id="cp-pix">Copiar chave</button></div><p class="hint">Depois de pagar, mande o comprovante na conversa do WhatsApp.</p></div>`}
function enviar(){
  if(!/^\d{12,13}$/.test(CFG.whatsapp)){toast("WhatsApp da loja não configurado");return}
  if(!$("f-nome").value.trim()){toast("Coloque seu nome 🙂");$("f-nome").focus();return}
  try{localStorage.setItem("lalas-cli",JSON.stringify({n:$("f-nome").value.trim(),a:$("f-apto").value.trim()}))}catch(_){}
  st.num=novoNum();const m=msg(),n=CFG.whatsapp,wa=`https://wa.me/${n}?text=${encodeURIComponent(m)}`;copiar(m);
  const mob=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
  const tot=calc().total,pix=st.pag==="Pix"&&CFG.pix&&CFG.pix.chave;
  if(mob){const x=document.createElement("a");x.href=wa;x.target="_blank";x.rel="noopener noreferrer";document.body.appendChild(x);x.click();x.remove();toast("Abrindo o WhatsApp…");
    return}
  $("sd").innerHTML=`<div class="send-b"><h3 id="sd-title">Pedido nº ${esc(st.num)} pronto!</h3>
   <ol class="steps"><li>Abra o WhatsApp da <b>Lala's Açaí</b>: (${n.slice(2,4)}) ${n.slice(4,9)}-${n.slice(9)}.</li><li>O pedido já foi <b>copiado</b>: cole na conversa e envie.</li></ol>
   <a class="btn2 wa" href="https://web.whatsapp.com/send?phone=${n}&text=${encodeURIComponent(m)}" target="_blank" rel="noopener noreferrer">Abrir WhatsApp Web</a>
   <button class="btn2 alt" id="cp-again">Copiar o pedido de novo</button>
   <pre class="pv" id="pv"></pre><button class="btn2 gh" data-x="ov-send">Voltar</button></div>`;
  $("pv").textContent=m;openOv("ov-send");
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(e.target.classList&&e.target.classList.contains("ov")){keepForm();closeOv(e.target.id);return}
  if(!b)return;
  if(b.dataset.go){document.getElementById(b.dataset.go).scrollIntoView({behavior:"smooth",block:"start"});document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t===b));return}
  if(b.dataset.p){openProd(b.dataset.p);return}
  if(b.dataset.x){keepForm();closeOv(b.dataset.x);return}
  if(b.dataset.g!=null&&st.cur){saveObs();const x=b.dataset.g;st.cur.sel=st.cur.sel.includes(x)?st.cur.sel.filter(y=>y!==x):[...st.cur.sel,x];drawProd();return}
  if(b.dataset.a!=null&&st.cur){saveObs();const x=b.dataset.a;st.cur.adds=st.cur.adds.includes(x)?st.cur.adds.filter(y=>y!==x):[...st.cur.adds,x];drawProd();return}
  if(b.dataset.q){saveObs();st.cur.qty=Math.max(1,Math.min(10,st.cur.qty+ +b.dataset.q));drawProd();return}
  if(b.id==="add"){saveObs();const c=st.cur,it={tam:c.tam,sel:[...c.sel],adds:[...c.adds],obs:c.obs};
    if(c.edit!=null){st.cart[c.edit]=it;closeOv("ov-prod");drawBag();drawBagBar();openOv("ov-bag");toast("Açaí atualizado");return}
    for(let i=0;i<c.qty;i++)st.cart.push({...it,sel:[...it.sel],adds:[...it.adds]});
    closeOv("ov-prod");drawBagBar();toast(c.qty>1?`${c.qty} açaís na sacola`:"Açaí na sacola 💜");return}
  if(b.id==="bag-btn"){drawBag();openOv("ov-bag");return}
  if(b.dataset.rm!=null){keepForm();st.cart.splice(+b.dataset.rm,1);drawBagBar();if(!st.cart.length){closeOv("ov-bag");return}drawBag();return}
  if(b.dataset.ed!=null){keepForm();const k=+b.dataset.ed;closeOv("ov-bag");openProd(st.cart[k].tam,k);return}
  if(b.dataset.pg){keepForm();st.pag=b.dataset.pg;drawBag();return}
  if(b.id==="send"){keepForm();enviar();return}
  if(b.id==="cp-pix"){copiar(CFG.pix.chave);b.textContent="Copiada ✓";toast("Chave Pix copiada");return}
  if(b.id==="cp-again"){if(copiar($("pv").textContent))toast("Pedido copiado");else toast("Selecione o texto e copie");return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const o=[...document.querySelectorAll(".ov.on")].pop();if(o){keepForm();closeOv(o.id)}}});
drawTop();drawBagBar();setInterval(drawStatus,60000);
</script>
</body>
</html>
